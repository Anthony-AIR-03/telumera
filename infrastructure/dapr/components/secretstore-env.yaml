# Resolves Dapr component secretKeyRefs from the daprd sidecar container's
# own environment variables, so real credentials (e.g. the RabbitMQ
# connection string) never need to be written into a committed component
# YAML file. Local-only: per docs/adr/0002-dapr-pubsub-abstraction.md's
# portability table, the self-hosted secret mechanism is "Docker
# secrets/environment files" — Azure swaps this for Key Vault + managed
# identity, not this component.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: local-env-secret-store
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
