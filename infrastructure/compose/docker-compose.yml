# Local self-hosted runtime for Telumera (M00.3+). Brings up shared platform
# infrastructure — Postgres, ClickHouse, RabbitMQ, Redis, MinIO, an OTel
# Collector, a Dapr placement service + one headless "smoke-test" Dapr
# sidecar — plus the real application services built so far:
# identity-workspace, site-registry, and gateway (a transparent reverse
# proxy in front of both — see gateway/README.md). services/event-collector/
# is still an empty scaffold and gets its own compose entry the same way,
# once built.
#
# Usage: see infrastructure/compose/README.md. Quick start:
#   cp .env.example .env   # then fill in local values
#   docker compose up -d
#   ./scripts/health-check.sh

name: telumera-local

networks:
  telumera-net:
    name: telumera-net

volumes:
  postgres-data:
  clickhouse-data:
  rabbitmq-data:
  redis-data:
  minio-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - telumera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_APP_PASSWORD: ${CLICKHOUSE_APP_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9004:9000" # native protocol (remapped: 9000 is MinIO's API port)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db-init/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./db-init/clickhouse/admin-access-management.xml:/etc/clickhouse-server/users.d/zz-admin-access-management.xml:ro
    networks:
      - telumera-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI / HTTP API
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - telumera-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - telumera-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    networks:
      - telumera-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Receives OTLP traces from every .NET service (packages/dotnet-service-defaults) and every Dapr
  # sidecar (infrastructure/dapr/config/config.yaml), exporting to its own container logs — enough to
  # prove distributed tracing propagates end-to-end (`docker compose logs otel-collector`) without a
  # trace UI (M00.5; add one later by extending infrastructure/observability/otel-collector-config.yaml
  # with a real backend exporter — nothing upstream needs to change).
  otel-collector:
    image: otel/opentelemetry-collector:0.112.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — services' OTEL_EXPORTER_OTLP_ENDPOINT
      - "4318:4318" # OTLP HTTP — Dapr's tracing.otel endpoint (config.yaml)
    networks:
      - telumera-net

  dapr-placement:
    image: daprio/dapr:1.14.4
    restart: unless-stopped
    command: ["./placement", "-port", "50006"]
    networks:
      - telumera-net

  # Headless Dapr sidecar with no attached app — exists purely so
  # health-check.sh/.ps1 can prove the RabbitMQ pub/sub component actually
  # works (publish through it, see the message land in RabbitMQ) before any
  # real service exists to attach a sidecar to. Real services get their own
  # sidecar defined the same way (app-id = service name, --app-port set),
  # once they're scaffolded.
  dapr-smoke-test-sidecar:
    image: daprio/daprd:1.14.4
    restart: unless-stopped
    command:
      - "./daprd"
      - "-app-id=smoke-test"
      - "-dapr-http-port=3500"
      - "-dapr-grpc-port=50001"
      - "-placement-host-address=dapr-placement:50006"
      - "-resources-path=/components"
      - "-config=/config/config.yaml"
    environment:
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    volumes:
      - ../dapr/components:/components:ro
      - ../dapr/config:/config:ro
    ports:
      - "3500:3500" # Dapr HTTP API (health-check.sh smoke-publishes through this)
      - "50001:50001" # Dapr gRPC API
    depends_on:
      dapr-placement:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - telumera-net

  # First two real M00.4 services.
  identity-workspace:
    build:
      context: ../..
      dockerfile: services/identity-workspace/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__IdentityWorkspace: "Host=postgres;Port=5432;Database=telumera_access;Username=svc_access;Password=${APP_DB_PASSWORD}"
      AzureAd__TenantId: "${AZURE_AD_TENANT_ID}"
      AzureAd__ClientId: "${AZURE_AD_API_CLIENT_ID}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "5101:8080" # HTTP API
      - "3503:3500" # identity-workspace-dapr's HTTP API (shared namespace; published here since network_mode: service:x sidecars can't publish their own ports)
      - "50004:50001" # identity-workspace-dapr's gRPC API
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - telumera-net

  # identity-workspace's own sidecar — added once site-registry needed to check membership via Dapr
  # service invocation (docs/adr/0002-dapr-pubsub-abstraction.md), which requires -app-port so Dapr
  # can proxy invocations into the app (unlike site-registry-dapr, which is publish-only and needs
  # no app-port). Follows the same "Adding a real service's sidecar" pattern as site-registry-dapr,
  # just for the invoke building block instead of pubsub.
  identity-workspace-dapr:
    image: daprio/daprd:1.14.4
    restart: unless-stopped
    command:
      - "./daprd"
      - "-app-id=identity-workspace"
      - "-app-port=8080"
      - "-dapr-http-port=3500"
      - "-dapr-grpc-port=50001"
      - "-placement-host-address=dapr-placement:50006"
      - "-resources-path=/components"
      - "-config=/config/config.yaml"
    environment:
      # Dapr initializes every component under -resources-path at startup regardless of whether
      # the app actually uses it — identity-workspace never publishes/subscribes, but the shared
      # pubsub-rabbitmq.yaml component still needs this to resolve or the sidecar fails to start.
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    volumes:
      - ../dapr/components:/components:ro
      - ../dapr/config:/config:ro
    network_mode: "service:identity-workspace"
    depends_on:
      identity-workspace:
        condition: service_started
      dapr-placement:
        condition: service_started
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  site-registry:
    build:
      context: ../..
      dockerfile: services/site-registry/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__SiteRegistry: "Host=postgres;Port=5432;Database=telumera_sites;Username=svc_sites;Password=${APP_DB_PASSWORD}"
      DAPR_HTTP_PORT: "3500" # matches site-registry-dapr's -dapr-http-port below (shared network namespace)
      AzureAd__TenantId: "${AZURE_AD_TENANT_ID}"
      AzureAd__ClientId: "${AZURE_AD_API_CLIENT_ID}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "5102:8080" # HTTP API
      - "3502:3500" # site-registry-dapr's HTTP API (shared namespace; published here since network_mode: service:x sidecars can't publish their own ports)
      - "50003:50001" # site-registry-dapr's gRPC API
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - telumera-net

  # site-registry's own sidecar — it publishes site.created.v1 through the "pubsub"
  # component (see OutboxPublisher in services/site-registry/), following the pattern
  # docs/runbooks/local-environment.md documents under "Adding a real service's sidecar".
  # -app-port added once gateway needed to invoke *into* site-registry (GatewayForwarder) —
  # before that, site-registry only ever made outbound calls (publish), never received inbound
  # Dapr invocations, so no app-port was needed. Same evolution identity-workspace-dapr went
  # through when site-registry's MembershipClient first needed to invoke it.
  site-registry-dapr:
    image: daprio/daprd:1.14.4
    restart: unless-stopped
    command:
      - "./daprd"
      - "-app-id=site-registry"
      - "-app-port=8080"
      - "-dapr-http-port=3500"
      - "-dapr-grpc-port=50001"
      - "-placement-host-address=dapr-placement:50006"
      - "-resources-path=/components"
      - "-config=/config/config.yaml"
    environment:
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    volumes:
      - ../dapr/components:/components:ro
      - ../dapr/config:/config:ro
    network_mode: "service:site-registry"
    depends_on:
      site-registry:
        condition: service_started
      dapr-placement:
        condition: service_started
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # The single authenticated public API surface — a transparent reverse proxy in front of
  # identity-workspace/site-registry (see gateway/GatewayForwarder.cs and gateway/README.md).
  # Holds no data of its own, so no ConnectionStrings__* here.
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      DAPR_HTTP_PORT: "3500" # matches gateway-dapr's -dapr-http-port below (shared network namespace)
      AzureAd__TenantId: "${AZURE_AD_TENANT_ID}"
      AzureAd__ClientId: "${AZURE_AD_API_CLIENT_ID}"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "5100:8080" # HTTP API
      - "3504:3500" # gateway-dapr's HTTP API (shared namespace; published here since network_mode: service:x sidecars can't publish their own ports)
      - "50005:50001" # gateway-dapr's gRPC API
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - telumera-net

  # gateway's own sidecar — outbound-only (it invokes identity-workspace/site-registry, nothing
  # invokes it back via Dapr), so no -app-port, same shape site-registry-dapr originally had.
  gateway-dapr:
    image: daprio/daprd:1.14.4
    restart: unless-stopped
    command:
      - "./daprd"
      - "-app-id=gateway"
      - "-dapr-http-port=3500"
      - "-dapr-grpc-port=50001"
      - "-placement-host-address=dapr-placement:50006"
      - "-resources-path=/components"
      - "-config=/config/config.yaml"
    environment:
      # Dapr initializes every component under -resources-path at startup regardless of whether
      # the app actually uses it — gateway never publishes/subscribes, but the shared
      # pubsub-rabbitmq.yaml component still needs this to resolve or the sidecar fails to start.
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    volumes:
      - ../dapr/components:/components:ro
      - ../dapr/config:/config:ro
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_started
      dapr-placement:
        condition: service_started
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy
