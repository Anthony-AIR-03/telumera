# NAS production override for docker-compose.yml — see docs/architecture/nas-deployment-profile.md,
# docs/runbooks/analytics-module.md and docs/runbooks/nas-runner-setup.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.nas.yml --env-file .env.nas pull
#   docker compose -f docker-compose.yml -f docker-compose.nas.yml --env-file .env.nas up -d --remove-orphans
#
# This is what .github/workflows/deploy-nas.yml runs on every push to main (after Container Build has
# pushed fresh images to GHCR). Nothing is compiled on the NAS.
#
# What this changes vs. local dev:
#   - The six app services run from pre-built GHCR images (ghcr.io/anthony-air-03/telumera-<svc>),
#     not a local `build:` — the tag is $TELUMERA_IMAGE_TAG (set to sha-<short> by the deploy
#     workflow; defaults to `latest` for a manual `docker compose` run).
#   - No published host ports (`ports: !reset []`) — nothing on the NAS is reachable except through
#     the existing Nginx Proxy Manager + Cloudflare Tunnel. Needs Compose >= 2.24 for `!reset`.
#   - gateway / event-collector / analytics / dashboard-web also join the pre-existing external `npm`
#     Docker network so NPM can proxy to them by container name (api./hubs./collect./apex telumera.nl).
#   - mem_limit / cpus per the profile's §6 table — tune to the actual NAS.
#
# Cross-origin CORS for the gateway and analytics is handled by the NAS .env alone: set
# CORS_ALLOWED_ORIGINS=https://telumera.nl and both pick it up (they already read it). The
# event-collector is different — it's the multi-tenant public ingestion endpoint, so its CORS
# allowlist is derived per-request from each registered site's AllowedOrigins (see
# services/event-collector/README.md), not from an env var. A site must have its browser origin
# (e.g. https://anthony-air.nl) registered for the SDK to POST events from that page.

networks:
  npm:
    external: true

services:
  postgres:
    ports: !reset []
    mem_limit: 512m

  clickhouse:
    ports: !reset []
    mem_limit: 2g

  rabbitmq:
    ports: !reset []
    mem_limit: 256m

  redis:
    ports: !reset []
    mem_limit: 128m

  seaweedfs:
    ports: !reset []
    mem_limit: 256m

  otel-collector:
    ports: !reset []
    mem_limit: 192m

  dapr-placement:
    mem_limit: 128m

  dapr-smoke-test-sidecar:
    ports: !reset []
    mem_limit: 128m

  identity-workspace:
    image: ghcr.io/anthony-air-03/telumera-identity-workspace:${TELUMERA_IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    mem_limit: 256m

  identity-workspace-dapr:
    mem_limit: 128m

  site-registry:
    image: ghcr.io/anthony-air-03/telumera-site-registry:${TELUMERA_IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    mem_limit: 256m

  site-registry-dapr:
    mem_limit: 128m

  gateway:
    image: ghcr.io/anthony-air-03/telumera-gateway:${TELUMERA_IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    mem_limit: 256m
    networks:
      - telumera-net
      - npm

  gateway-dapr:
    mem_limit: 128m

  event-collector:
    image: ghcr.io/anthony-air-03/telumera-event-collector:${TELUMERA_IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    mem_limit: 256m
    environment:
      # Behind Cloudflare → tunnel → NPM the socket peer is the proxy, not the visitor. Trust
      # Cloudflare's own client-IP header (it strips/overwrites any client-supplied value) so the
      # visitor hash + GeoIP see the real address. The collector is not reachable except via NPM.
      Collector__ForwardedForHeader: "CF-Connecting-IP"
    networks:
      - telumera-net
      - npm

  event-collector-dapr:
    mem_limit: 128m

  analytics:
    image: ghcr.io/anthony-air-03/telumera-analytics:${TELUMERA_IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    mem_limit: 512m
    networks:
      - telumera-net
      - npm

  analytics-dapr:
    mem_limit: 128m

  # The Vue app isn't containerised for local dev — this static-nginx image only exists for the NAS.
  # Built by container-build.yml with the prod VITE_* values baked in (see that workflow).
  dashboard-web:
    image: ghcr.io/anthony-air-03/telumera-dashboard-web:${TELUMERA_IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - npm
